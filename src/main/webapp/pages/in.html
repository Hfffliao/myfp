<!DOCTYPE html>
<html lang="zh-CN">
<script>
    // 定义全局变量存储上下文路径
    function getContextPath() {
        const pathName = window.location.pathname;
        console.log('pathName:', pathName);
        // 查找第二个 / 的索引
        const Index = pathName.indexOf('p');
        return pathName.substring(0,Index-1 );
    }
    const contextPath = getContextPath();
    console.log('上下文路径:', contextPath);

    // 动态创建 script 标签并设置 src 属性
    const script = document.createElement('script');
    script.src = contextPath + '/pages/js/hangbege.js';
    document.head.appendChild(script);
    // 动态创建 link 标签并设置 href 属性
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = contextPath + '/pages/css/linyistyle.css';
    document.head.appendChild(link);
</script>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.6">
    <title>霖依</title>
    <!-- 引入字体图标 -->
    <link rel="stylesheet" href="css/font-awesome/css/all.min.css">
    <style>

        /* 卡片布局 */
        .card-container {
            max-width:none;
            margin: 0rem ;
            font-size: large;
            padding: 3rem;
            display:flex;
            /* 水平排列 */
            flex-direction: column;
            /* 允许换行 */
            flex-wrap: wrap;
            gap: 1rem;
            background:rgba(198, 18, 18, 0.5);
            justify-content: center;
            align-items: center;

        }
        .card1{
            display:flex;
            display: flex;
            /* 水平排列 */
            flex-direction: column;
            /* 允许换行 */
            flex-wrap: wrap;
            gap: 1rem;
            justify-content: center;
            align-items: center;
        }
        .card-in{
            font-size: 20px;
            width: 300px;
            height: 40px;
            padding: 1px; /* 内边距，调整内容与边框的距离 */
        }
        #area {
            width: 25%;
            height: 50px;
            background-color: #e8d4da;
            font-size: large;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 280px;
            margin: 8px 0;
            font-size: 14px;
        }
        .checkbox-group label {
            cursor: pointer;
            color: #2d2d2d;
        }
        .checkbox-group input {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            vertical-align: middle;
        }


        /* 页脚样式 */

    </style>
</head>
<body>

<div id="header"></div>
<main>

    <section class="hero">
        <div class="hero-content">
            <h1>登录home，享受专业的服务</h1>
            <div class="hero1"> <h2>输入给定的用户名和密码进行登录</h2></div>
        </div>
    </section>

    <div class="card-container">
        <div  method="post" class="card1">
            用户名（邮箱地址）：<input type ="text" name="username" class="card-in"><br>

            密码：<input  type ="password" name="password" class="card-in"><br>
            <!-- 在密码输入框和登录按钮之间插入 -->
            <div class="checkbox-group">
                <label>
                    <input type="checkbox" id="rememberMeCheckbox"> 自动登录（下次免密）
                </label>
            </div>
            <input type="button"  value="登录" id="area" onclick="bt()">


        </div>
        <div>
            <a id="register" >注册账号</a>
            <a id="forgetpassword" >注册账号</a>
        </div>
    </div>
</main>
<script>
  document.getElementById("register").href = contextPath + "/pages/register.html";
  document.getElementById("forgetpassword").href = contextPath + "/pages/getpassword.html";
  window.addEventListener('load',init)
  function init() {
      // 先填充“记住密码”保存的账号密码（如果存在）
      const savedUsername = localStorage.getItem('savedUsername');
      const savedPassword = localStorage.getItem('savedPassword');
      if (savedUsername) {
          document.querySelector("input[name='username']").value = savedUsername;
      }
      if (savedPassword) {
          document.querySelector("input[name='password']").value = savedPassword;
      }
      autoLogin();   // 添加这一行
  }
  function bt() {
      fetch(endpointPath + "/login", {
          method: "POST",
          headers: {
              "Content-Type": "application/json"
          },
          body: JSON.stringify({
              username: document.querySelector("input[name='username']").value,
              password: document.querySelector("input[name='password']").value
          }),
          credentials: "include"
      })
          .then(function(response) {
              const sessionId = response.headers.get('TK');  // 在这里获取 sessionId
              if (sessionId) {
                  localStorage.setItem('sessionId', sessionId);
              }
              if (response.ok) {
                  return response.json().then(data => ({ data, sessionId })); // 将 sessionId 传递给下一个 then
              } else {
                  alert('登录失败');
                  throw new Error(`登录失败，状态码: ${response.status}`);
              }
          })
          .then(function({ data, sessionId }) {  // 接收 sessionId 和 data
              if (data.user) {
                  const currentDate = new Date();
                  const expirationDate = new Date(currentDate.getTime() + 30 * 60 * 1000);
                  localStorage.setItem('username', data.user);
                  localStorage.setItem('expirationDate', expirationDate.toISOString());
                  console.log('登录成功');

                  // ========== 自动登录凭证处理（存储用户名/密码） ==========
                  const rememberMe = document.getElementById('rememberMeCheckbox').checked;
                  if (rememberMe) {
                      // 保存用户名和密码（明文，用于下次自动填充）
                      const username = document.querySelector("input[name='username']").value;
                      const password = document.querySelector("input[name='password']").value;
                      localStorage.setItem('autoUsername', username);
                      localStorage.setItem('autoPassword', password);
                  } else {
                      // 未勾选则清除旧凭证
                      localStorage.removeItem('autoUsername');
                      localStorage.removeItem('autoPassword');
                  }
                  // ====================================================
                  // 保存用户名和密码（明文）
                  localStorage.setItem('savedUsername', document.querySelector("input[name='username']").value);
                  localStorage.setItem('savedPassword', document.querySelector("input[name='password']").value);
                  alert('登录成功');
                  window.location.href = contextPath + "/pages/main.html";
              } else {
                  throw new Error('验证成功但是无用户信息');
              }
          })
          .catch(function(error) {
              console.error('登录失败:', error);
          });
  }
  // 自动登录：填充表单并模拟点击登录按钮
  let autoLoginAttempted = false;  // 防止重复执行自动登录

  function autoLogin() {
      if (autoLoginAttempted) return;
      autoLoginAttempted = true;

      const savedUsername = localStorage.getItem('autoUsername');
      const savedPassword = localStorage.getItem('autoPassword');
      if (!savedUsername || !savedPassword) return;

      // 填充表单
      document.querySelector("input[name='username']").value = savedUsername;
      document.querySelector("input[name='password']").value = savedPassword;

      // 模拟点击登录按钮（触发 bt）
      const loginBtn = document.getElementById("area");
      if (loginBtn) {
          loginBtn.click();
      }
  }
</script>
<div id="footer"></div>
</body>
</html>
