    <script>
        // 定义全局变量存储上下文路径
        function getContextPath() {
            const pathName = window.location.pathname;
            //   console.log('pathName:', pathName);
            // 查找第二个 / 的索引
            const Index = pathName.indexOf('p');
            return pathName.substring(0, Index - 1);
        }
        const contextPath = getContextPath();
        //  console.log('上下文路径:', contextPath);

        // 动态加载脚本的函数
        function loadScript(src, onLoad, onError) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = onLoad;
            script.onerror = onError;
            document.head.appendChild(script);
        }

        // 动态加载样式表的函数
        function loadStylesheet(href, onLoad, onError) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            link.onload = onLoad;
            link.onerror = onError;
            document.head.appendChild(link);
        }

        // 加载 hangbege.js
        loadScript(
            contextPath + '/pages/js/hangbege.js',

        );

<script>
    function closefileshow() {
        document.getElementById('fileshow').style.display = 'none';
        document.getElementById('fileshow-overlay').style.display = 'none';
    }

    // 新增：关闭 moreoperation 面板的函数
    function closeMoreOperation() {
        document.getElementById('moreoperation').style.display = 'none';
    }

    ///////创建文件夹
    function createNewFolder() {
        // 隐藏其他表单
        const otherForm = document.getElementById('toolbar');
        otherForm.style.display = 'none';
        // 显示新建文件夹表单
        const newFolderForm = document.getElementById('new-folder-form');
        newFolderForm.style.display = 'block';
    }
    // 保存新建文件夹
    async function saveNewFolder() {

        //获取新建文件夹表单
        const folderName = document.getElementById('new-folder-name').value.trim();
        if (folderName) {
            try {
                const pathParam = currentPath.join('/');
                const response = await fetch('/create-folder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: pathParam,
                        name: folderName
                    })
                });

                if (!response.ok) {
                    throw new Error('创建文件夹失败');
                }

                await initFileList();
            } catch (error) {
                console.error('创建文件夹出错:', error);
            }
        }
        cancelNewFolder();
    }
    //关闭新建文件夹
    function cancelNewFolder() {
        document.getElementById('new-folder-form').style.display = 'none';
        document.getElementById('toolbar').style.display = 'block';
    }

    ///////// 删除文件或文件夹
    async function deleteItem(name,type,id) {
        try {


            let joincurrentPath = currentPath.join('/');
            //如果joincurrentPath不为空，且不以/结尾，添加/来构造合法url
            console.log(joincurrentPath);
            if (joincurrentPath.length > 0) {
                joincurrentPath += '/';
            }
            // 对路径和文件名进行 URL 编码
            const encodedPath = encodeURIComponent(joincurrentPath);
            const encodedName = encodeURIComponent(name);
            const encodedid = encodeURIComponent(id);

            let url = `${endpointPath}/file`;
            url+=`?filepn=${encodedPath}${encodedName}&fileid=${encodedid}&type=${type}`
            const response = await fetch(url, {
                method: 'DELETE',
                credentials: "include"
            });
            console.log('id='+id+';type='+type);
            if (!response.ok) {
                throw new Error('删除文件/文件夹失败');
            }
            await getFilePathSystemAndInit();
        } catch (error) {
            await getFilePathSystemAndInit();
            console.error('删除文件/文件夹出错:', error);
        }
    }
    ///////// 处理文件上传
    async function handleFileUpload(input) {
        const files = Array.from(input.files);
        const formData = new FormData();
        let tatolsize = 0;//记录总大小


        files.forEach(file => {
            tatolsize += file.size;
        });

        //添加大小
        formData.append('tatolsize', tatolsize);
        // 将文件添加到 FormData
        files.forEach(file => {
            formData.append('files', file, file.name);
        });
        //添加相对路径
        formData.append('relativePath', currentPath.join('/'));
        try {
            const sessionId = localStorage.getItem('sessionId');
            let requestUrl = endpointPath + '/folder';
            requestUrl += `;jsessionid=${sessionId}`;
            const response = await fetch(requestUrl, {
                method: 'POST',
                body: formData,
                credentials: "include"
                // 监听上传进度
            });

            if (!response.ok) {
                throw new Error('上传失败');
            }

            const data = await response.json();
            console.log('上传成功', data);
            await initFileList();
        } catch (error) {
            console.error('上传错误', error);
        } finally {
            input.value = ''; // 清空输入框
        }
    }
    /////////处理上传文件夹
    function handleFolderUpload(input) {
        const files = Array.from(input.files);
        const formData = new FormData();
        let tatolsize = 0;//记录总大小
        // 构建文件夹结构和添加文件到 FormData
        let filestructure = [];
        // 辅助函数，根据路径在filestructure查找或创建文件夹
        function findOrCreateFolder(folderArray, pathParts) {
            let current = folderArray;
            for (let i = 0; i < pathParts.length; i++) {
                const part = pathParts[i];
                let folder = current.find(item => item.name === part && item.type === 'folder');
                if (!folder) {
                    folder = { name: part, type: 'folder', children: [] };
                    current.push(folder);
                }
                current = folder.children;
            }
            return current;
        }
        //主函数，便利文件构造文件结构，计算总大小，将文件添加到formdata
        files.forEach(file => {
            const relativePath = file.webkitRelativePath;
            if (relativePath) {
                const pathParts = relativePath.split('/');
                const filename = pathParts.pop(); // 移除并返回最后一个元素作为文件名
                const parentFolder = findOrCreateFolder(filestructure, pathParts);
                // 添加文件到父文件夹
                parentFolder.push({ name: filename, type: 'file' });
            } else {
                // 处理根目录下的文件
                filestructure.push({ name: file.name, type: 'file' });
            }
            tatolsize += file.size;
            formData.append('files', file, file.name);
        });
        //添加大小
        formData.append('tatolsize', tatolsize);

        //添加相对路径
        formData.append('relativePath', currentPath.join('/'));
        //添加文件夹结构
        formData.append('filestructure', JSON.stringify(filestructure));
        console.log(tatolsize);
        console.log(JSON.stringify(filestructure));
        // 发送数据到后端
        const sessionId = localStorage.getItem('sessionId');
        let requestUrl = endpointPath + '/folder';
        requestUrl += `;jsessionid=${sessionId}`;
        fetch(requestUrl, {
            method: 'POST',
            body: formData,
            credentials: "include"

        })
            .then(response => {
                if (response.status == 401) {
                    alert('please login');
                }
                if (!response.ok) {
                    throw new Error('上传失败');
                }

                return response.json();
            })
            .then(data => {
                alert('upload success');
                getFilePathSystemAndInit();
            })
            .catch(error => {
                console.error('上传错误', error);
            })
            .finally(() => {
                input.value = ''; // 清空输入框
            });
    }
    //验证空间够吗
    async function checkSpace(tatolsize) {
        const sessionId = localStorage.getItem('sessionId');
        let requestUrl = endpointPath + '/folder_check';
        requestUrl += `;jsessionid=${sessionId}`;
        try {
            const response = await fetch(requestUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    tatolsize: tatolsize
                })

            if (!response.ok) {
                throw new Error('上传失败');
            }
            return response.json();
        } catch (error) {
            console.error('上传错误', error);
        }
    }
    //////////// 开始重命名
    function startRename(id){
        let currentFileSystem = fileSystem;
        currentPath.forEach(pathPart => {
            const folder = currentFileSystem.find(item => item.name === pathPart && item.type === 'folder');
            if (folder) {
                currentFileSystem = folder.children;
            }
        });

        let index = currentFileSystem.findIndex(item => item.id == id);
        if (index === -1) return;

        const item = currentFileSystem[index];
        const listItem = document.querySelectorAll('.file-item')[index + (currentPath.length > 0 ? 1 : 0)];
        const nameElement = listItem.querySelector('.file-body');
        const oldName = item.name;
        const input = document.createElement('input');
        input.className = 'rename-input';
        input.value = oldName;

        //隐藏文件file-body
        nameElement.style.display = 'none';
        //隐藏文件操作按钮容器
        const actionsDiv = listItem.querySelector('.file-actions');
        actionsDiv.style.display = 'none';
        //添加重命名文本输入框
        listItem.appendChild(input);

        //创建重命名按钮容器，显示保存、取消按钮
        const actionsRename = document.createElement('div');
        actionsRename.style = "display:flex; gap:6px; flex-shrink:0;";
        actionsRename.className = 'file-actions-rename';//文件重命名按钮容器:保存、取消
        //添加保存、取消按钮
        const saveBtn = document.createElement('button');
        saveBtn.className = 'save-btn';
        saveBtn.textContent = '保存';
        saveBtn.onclick = () => saveRename(id, input, listItem, oldName);
        actionsRename.appendChild(saveBtn);
        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'cancel-btn';
        cancelBtn.textContent = '取消';
        cancelBtn.onclick = () => cancelRename(id, listItem, oldName);
        actionsRename.appendChild(cancelBtn);
        listItem.appendChild(actionsRename);
    }
    // 保存重命名
    async function saveRename(id, inputElement, listItem, oldName) {
        const newName = inputElement.value;
        if (newName.trim()) {
            let currentFileSystem = fileSystem;
            currentPath.forEach(pathPart => {
                const folder = currentFileSystem.find(item => item.name === pathPart && item.type === 'folder');
                if (folder) {
                    currentFileSystem = folder.children;
                }
            });

            const item = currentFileSystem.find(item => item.id == id);
            if (!item) return;

            try {
                const response = await fetch(`${endpointPath}/file`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        id: id,
                        newName: newName.trim()
                    })
                });

                if (!response.ok) {
                    throw new Error('重命名失败');
                }

                item.name = newName;
                initFileList();
            } catch (error) {
                console.error('重命名出错:', error);
                cancelRename(id, listItem, oldName);
            }
        } else {
            cancelRename(id, listItem, oldName);
        }
    }
    // 取消重命名
    function cancelRename(id, listItem, oldName) {
        const inputElement = listItem.querySelector('.rename-input');

        const  nameElement = listItem.querySelector('.file-body');
        nameElement.style.display = 'inline-flex';
        inputElement.remove();
        //恢复文件操作按钮容器，删除重命名按钮容器
        const actionsDiv = listItem.querySelector('.file-actions');
        actionsDiv.style.display = 'flex';
        listItem.querySelector('.file-actions-rename')?.remove();
    }
    ////////// 单击文件项
    async function clickFileItem(name) {
        try {
            let joincurrentPath = currentPath.join('/');
            //如果joincurrentPath不为空，且不以/结尾，添加/来构造合法url
            console.log(joincurrentPath);
            if (joincurrentPath.length > 0) {
                joincurrentPath += '/';
            }
            // 对路径和文件名进行 URL 编码
            const encodedPath = encodeURIComponent(joincurrentPath);
            const encodedName = encodeURIComponent(name);
            let url = `${endpointPath}/file`;
            //添加查询参数
            url += `?filepn=${encodedPath}${encodedName}`;
            console.log(url);
            // 发送请求
            const response = await fetch(url, {
                method: 'GET',
                credentials: 'include'
            });

            if (!response.ok) {
                // 创建一个自定义错误对象，包含 response 属性
                const customError = new Error(`HTTP error! status: ${response.status}`);
                customError.response = response;
                throw customError;
            }

            // 获取响应的 Blob 对象
            const blob = await response.blob();

            // 创建下载链接
            const urlObject = window.URL.createObjectURL(blob);
            // 从响应头中获取文件名
            const contentDisposition = response.headers.get('Content-Disposition');
            console.log(contentDisposition);
            let filenameMatch;
            if (contentDisposition) {
                filenameMatch = contentDisposition.match(/filename="?([^"]+)"?/);
            }
            console.log(filenameMatch);
            //配置下载按钮
            let link = document.getElementById('downloadlink');
            link.textContent = '下载';
            link.onclick = () => {
                //配置下载链接
                const a = document.createElement('a');
                a.href = urlObject;
                if (filenameMatch) {
                    a.download = decodeURIComponent(filenameMatch[1]);
                }
                a.click();
               window.URL.revokeObjectURL(urlObject);
            }
            //获取文件类型
            let filetype = decodeURIComponent(filenameMatch[1]).substring(decodeURIComponent(filenameMatch[1]).lastIndexOf('.') + 1);
            //如果是可显示的则显示
            if (
            //    filetype == 'doc'  || filetype == 'docx' || filetype == 'xls' || filetype == 'xlsx' ||
            // filetype == 'ppt' || filetype == 'pptx' || filetype == 'pdf'||
            filetype == 'txt'||filetype=='md'||filetype=='jpg'||filetype=='png'|| filetype=='mmd'||filetype=='mermaid') {

                let show = document.getElementById('fileshow');
                let showcontent = document.getElementById('fileshowcontent');
                showcontent.innerHTML = '';
                if (filetype === 'txt') {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const textarea = document.createElement('textarea');
                        textarea.value = e.target.result;
                        textarea.style.width = '100%';
                        textarea.style.height = '100%';
                        textarea.style.resize = 'none';
                        showcontent.appendChild(textarea);
                    };
                    reader.readAsText(blob);
                    show.style.display = 'flex';  // 改为 flex 才能撑满
                    document.getElementById('fileshow-overlay').style.display = 'block';

// 同时设置标题
                    document.getElementById('fileshow-title').textContent = name;
                }
                if (filetype === 'md') {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const div = document.createElement('div');
                        div.className = 'markdown-body';
                        div.innerHTML = marked.parse(e.target.result);
                        showcontent.appendChild(div);
                    };
                    reader.readAsText(blob);
                    show.style.display = 'flex';  // 改为 flex 才能撑满
                    document.getElementById('fileshow-overlay').style.display = 'block';

// 同时设置标题
                    document.getElementById('fileshow-title').textContent = name;
                }
                if(filetype=='jpg'||filetype=='png'){
                    const img = document.createElement('img');
                    img.src = urlObject;
                    img.style.width = '70%';
                    showcontent.appendChild(img);
                    show.style.display = 'flex';  // 改为 flex 才能撑满
                    document.getElementById('fileshow-overlay').style.display = 'block';

// 同时设置标题
                    document.getElementById('fileshow-title').textContent = name;
                }
                if (filetype === 'mermaid' || filetype === 'mmd') {
                    const reader = new FileReader();
                    reader.onload = async function(e) {
                        const container = document.createElement('div');
                        container.style.cssText = 'display:flex;justify-content:center;padding:8px 0;';
                        const pre = document.createElement('pre');
                        pre.className = 'mermaid';
                        pre.textContent = e.target.result;
                        container.appendChild(pre);
                        showcontent.appendChild(container);

                        // ★ 关键：必须先让容器可见，mermaid 才能获取到尺寸
                        show.style.display = 'flex';  // 改为 flex 才能撑满
                        document.getElementById('fileshow-overlay').style.display = 'block';

// 同时设置标题
                        document.getElementById('fileshow-title').textContent = name;

                        // 等浏览器完成布局渲染
                        await new Promise(r => setTimeout(r, 100));

                        try {
                            mermaid.initialize({ startOnLoad: false, theme: 'default' });
                            await mermaid.run({ nodes: [pre] });
                        } catch (err) {
                            container.innerHTML = `<div style="color:#dc3545;padding:20px;text-align:center;">
                <p style="font-weight:600;">Mermaid 渲染失败</p>
                <p style="font-size:13px;color:#6a737d;margin-top:4px;">${err.message}</p>
            </div>`;
                        }
                    };
                    reader.readAsText(blob);
                    // 注意：这里不再提前设 display = 'block'，由 reader.onload 内部控制
                }

            } else {
                // 触发点击事件进行下载
                link.click();
            }
            console.log(filetype);
        } catch (error) {
            console.error('下载错误', error);
            errorhandle(error);          // 可以在这里添加用户提示，如显示错误信息弹窗
        }
    }

    // 模拟文件系统数据，添加 children 属性来表示子文件和文件夹
    let fileSystem = [
        {
            id: '1',
            name: '文档',
            type: 'folder',
            whose: '3390351358@qq.com',
            path: '/文档',
            children: [
                { name: '报告.docx', type: 'file' }

            children: []
        }
    ];
let currentFile;

    // 当前所在的文件夹路径，初始为根目录
    let currentPath = [];

    // 初始化文件列表
    async function initFileList() {
        const fileList = document.getElementById('file-list');
        fileList.innerHTML = '';

        try {
            // 发送请求获取文件列表


            // 根据当前路径获取对应的文件系统数据
            let currentFileSystem = fileSystem;
            for (const pathPart of currentPath) {
                const folder = currentFileSystem.find(item =>
                    item.name === pathPart && item.type === 'folder'
                );
                if (folder) {
                    currentFileSystem = folder.children;
                } else {
                    break;
                }
            }

            // 如果不是根目录，添加返回上一级的按钮
            if (currentPath.length > 0) {
                const backItem = document.createElement('li');
                backItem.className = 'file-item';

                const icon = document.createElement('span');
                icon.className = 'file-icon folder';
                icon.innerHTML = '📁';
                backItem.appendChild(icon);

                const name = document.createElement('span');
                name.className = 'file-name';
                name.textContent = '..';
                backItem.onclick = goBack;
                backItem.appendChild(name);

                fileList.appendChild(backItem);
            }
            // 遍历文件系统数据，创建文件项
            currentFileSystem.forEach((item, index) => {
                //一个文件栏位
                const listItem = document.createElement('li');
                listItem.className = 'file-item';
                //文件栏位主体包括icon&name
                // 文件栏位主体（左侧）
                const filebody = document.createElement('div');
                filebody.className = 'file-body';
                filebody.style = "display:inline-flex; align-items:center; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;";
                listItem.appendChild(filebody);

                const icon = document.createElement('span');
                icon.className = `file-icon ${item.type}`;
                icon.innerHTML = item.type === 'folder' ? '📁' : '📄';
                filebody.appendChild(icon);

                const name = document.createElement('span');
                name.className = 'file-name';
                name.textContent = item.name;
                if (item.type === 'folder') {
                    filebody.onclick = () => enterFolder(item.name);
                }
                if (item.type === 'file') {
                    filebody.onclick = () => clickFileItem(item.name);
                }
                filebody.appendChild(name);

// ★ 按钮容器（右侧）
                const actions = document.createElement('div');
                actions.style = "display:flex; gap:6px; flex-shrink:0;";

                const renameBtn = document.createElement('button');
                renameBtn.className = 'rename-btn';

                const moreBtn = document.createElement('button');

                moreBtn.textContent = '更多';

                listItem.appendChild(actions);

            });

            // 更新当前路径显示
            const pathDisplay = document.getElementById('path-display');
            pathDisplay.textContent = `当前路径: /${currentPath.join('/')}`;
        } catch (error) {
            console.error('初始化文件列表出错:', error);
        }

    ////// 进入文件夹
    async function enterFolder(folderName) {
        currentPath.push(folderName);
        await initFileList();
    }

    ////// 返回上一级
    async function goBack() {
        currentPath.pop();
        await initFileList();
    }
    //////获取文件路径系统
    async function getFilePathSystem() {
        // 发送数据到后端
        const sessionId = localStorage.getItem('sessionId');
        let requestUrl = endpointPath + '/folder';
        requestUrl += `;jsessionid=${sessionId}`;
        fileSystem = await fetch(requestUrl, {
            headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
            }
        }).then(res => res.json());
    }
    //////获取并初始化文件列表
    function getFilePathSystemAndInit() {
        getFilePathSystem()
            .then(data => {
                // 初始化界面
                initFileList();
            })
            .catch(error => {
                console.error('获取文件路径出错:', error);
            });
    }
    window.onload = function () {
        getFilePathSystemAndInit();
    };
