        function getContextPath() {
            const pathName = window.location.pathname;
            //   console.log('pathName:', pathName);
            // 查找第二个 / 的索引
            const Index = pathName.indexOf('p');
            return pathName.substring(0, Index - 1);
        }
        const contextPath = getContextPath();
        //  console.log('上下文路径:', contextPath);

        // 动态加载脚本的函数
        function loadScript(src, onLoad, onError) {
            const script = document.createElement('script');
            script.src = src;
            script.onload = onLoad;
            script.onerror = onError;
            document.head.appendChild(script);
        }

        // 动态加载样式表的函数
        function loadStylesheet(href, onLoad, onError) {
            const link = document.createElement('link');
            link.rel = 'stylesheet';
            link.href = href;
            link.onload = onLoad;
            link.onerror = onError;
            document.head.appendChild(link);
        }

        // 加载 hangbege.js
        loadScript(
            contextPath + '/pages/css/hangbege.js',

                // console.log('hangbege.js 加载成功');

            () => console.error('linyistyle.css 加载失败')
        );
    </script>

    function closefileshow() {

    ///////创建文件夹
    function createNewFolder() {
        // 隐藏其他表单
        const otherForm = document.getElementById('toolbar');
        otherForm.style.display = 'none';
        // 显示新建文件夹表单
        const newFolderForm = document.getElementById('new-folder-form');
        newFolderForm.style.display = 'block';
    }
    // 保存新建文件夹
    async function saveNewFolder() {

        //获取新建文件夹表单
        const folderName = document.getElementById('new-folder-name').value.trim();
        if (folderName) {
            try {
                const pathParam = currentPath.join('/');
                const response = await fetch('/create-folder', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        path: pathParam,
                        name: folderName
                    })
                });

                if (!response.ok) {
                    throw new Error('创建文件夹失败');
                }

                await initFileList();
            } catch (error) {
                console.error('创建文件夹出错:', error);
            }
        }
        cancelNewFolder();
    }

    function cancelNewFolder() {
        document.getElementById('new-folder-form').style.display = 'none';
        document.getElementById('toolbar').style.display = 'block';

    ///////// 处理文件上传
    async function handleFileUpload(input) {
        const files = Array.from(input.files);
        const formData = new FormData();
        let tatolsize = 0;//记录总大小


        files.forEach(file => {
            tatolsize += file.size;
        });

        //添加大小
        formData.append('tatolsize', tatolsize);
        // 将文件添加到 FormData
        files.forEach(file => {
            formData.append('files', file, file.name);
        });
        //添加相对路径
        formData.append('relativePath', currentPath.join('/'));
        try {
            const sessionId = localStorage.getItem('sessionId');
            let requestUrl = endpointPath + '/folder';
            requestUrl += `;jsessionid=${sessionId}`;
            const response = await fetch(requestUrl, {
                method: 'POST',
                body: formData,
                credentials: "include"
                // 监听上传进度
            });

            if (!response.ok) {
                throw new Error('上传失败');
            }

            const data = await response.json();
            console.log('上传成功', data);
            await initFileList();
        } catch (error) {
            console.error('上传错误', error);
        } finally {
            input.value = ''; // 清空输入框
        }
    }
    /////////处理上传文件夹
    function handleFolderUpload(input) {
        const files = Array.from(input.files);
        const formData = new FormData();
        let tatolsize = 0;//记录总大小
        // 构建文件夹结构和添加文件到 FormData
        let filestructure = [];
        // 辅助函数，根据路径在filestructure查找或创建文件夹
        function findOrCreateFolder(folderArray, pathParts) {
            let current = folderArray;
            for (let i = 0; i < pathParts.length; i++) {
                const part = pathParts[i];
                let folder = current.find(item => item.name === part && item.type === 'folder');
                if (!folder) {
                    folder = { name: part, type: 'folder', children: [] };
                    current.push(folder);
                }
                current = folder.children;
            }
            return current;
        }
        //主函数，便利文件构造文件结构，计算总大小，将文件添加到formdata
        files.forEach(file => {
            const relativePath = file.webkitRelativePath;
            if (relativePath) {
                const pathParts = relativePath.split('/');
                const filename = pathParts.pop(); // 移除并返回最后一个元素作为文件名
                const parentFolder = findOrCreateFolder(filestructure, pathParts);
                // 添加文件到父文件夹
                parentFolder.push({ name: filename, type: 'file' });
            } else {
                // 处理根目录下的文件
                filestructure.push({ name: file.name, type: 'file' });
            }
            tatolsize += file.size;
            formData.append('files', file, file.name);
        });
        //添加大小
        formData.append('tatolsize', tatolsize);

        //添加相对路径
        formData.append('relativePath', currentPath.join('/'));
        //添加文件夹结构
        formData.append('filestructure', JSON.stringify(filestructure));
        console.log(tatolsize);
        console.log(JSON.stringify(filestructure));
        // 发送数据到后端
        const sessionId = localStorage.getItem('sessionId');
        let requestUrl = endpointPath + '/folder';
        requestUrl += `;jsessionid=${sessionId}`;
        fetch(requestUrl, {
            method: 'POST',
            body: formData,
            credentials: "include"

        })
            .then(response => {
                if (response.status == 401) {
                    alert('please login');
                }
                if (!response.ok) {
                    throw new Error('上传失败');
                }

                return response.json();
            })
            .then(data => {
                alert('upload success');
                getFilePathSystemAndInit();
            })
            .catch(error => {
                console.error('上传错误', error);
            })
            .finally(() => {
                input.value = ''; // 清空输入框
            });
    }
    //验证空间够吗
    async function checkSpace(tatolsize) {
        const sessionId = localStorage.getItem('sessionId');
        let requestUrl = endpointPath + '/folder_check';
        requestUrl += `;jsessionid=${sessionId}`;
        try {
            const response = await fetch(requestUrl, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    tatolsize: tatolsize
                })
            });

            if (!response.ok) {
                throw new Error('上传失败');
            }
            return response.json();
        } catch (error) {
            console.error('上传错误', error);
        }
    }
    //////////// 开始重命名
    function startRename(id){
        let currentFileSystem = fileSystem;
        currentPath.forEach(pathPart => {
            const folder = currentFileSystem.find(item => item.name === pathPart && item.type === 'folder');
            if (folder) {
                currentFileSystem = folder.children;
            }
        });

        let index = currentFileSystem.findIndex(item => item.id == id);
        if (index === -1) return;

        const item = currentFileSystem[index];
        const listItem = document.querySelectorAll('.file-item')[index + (currentPath.length > 0 ? 1 : 0)];
        const nameElement = listItem.querySelector('.file-name');
        const oldName = item.name;

        const input = document.createElement('input');
        input.className = 'rename-input';
        input.value = oldName;
        listItem.replaceChild(input, nameElement);

        const saveBtn = document.createElement('button');
        saveBtn.className = 'rename-btn';
        saveBtn.textContent = '保存';
        saveBtn.onclick = () => saveRename(id, input.value, listItem, oldName);
        listItem.replaceChild(saveBtn, listItem.querySelector('.rename-btn'));

        const cancelBtn = document.createElement('button');
        cancelBtn.className = 'delete-btn';
        cancelBtn.textContent = '取消';
        cancelBtn.onclick = () => cancelRename(id, listItem, oldName);
        listItem.appendChild(cancelBtn);
    }
    // 保存重命名
    async function saveRename(id, newName, listItem, oldName) {
        if (newName.trim()) {
            let currentFileSystem = fileSystem;
            currentPath.forEach(pathPart => {
                const folder = currentFileSystem.find(item => item.name === pathPart && item.type === 'folder');
                if (folder) {
                    currentFileSystem = folder.children;
                }
            });

            const item = currentFileSystem.find(item => item.id == id);
            if (!item) return;

            try {
                const response = await fetch(`${endpointPath}/file`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        id: id,
                        newName: newName.trim()
                    })
                });

                if (!response.ok) {
                    throw new Error('重命名失败');
                }

                item.name = newName;
                initFileList();
            } catch (error) {
                console.error('重命名出错:', error);
                cancelRename(id, listItem, oldName);
            }
        } else {
            cancelRename(id, listItem, oldName);
        }
    }
    // 取消重命名
    function cancelRename(id, listItem, oldName) {
        const nameElement = document.createElement('span');
        nameElement.className = 'file-name';
        nameElement.textContent = oldName;
        listItem.replaceChild(nameElement, listItem.querySelector('.rename-input'));

        const renameBtn = document.createElement('button');
        renameBtn.className = 'rename-btn';
        renameBtn.textContent = '重命名';
        renameBtn.onclick = () => startRename(id);
        listItem.replaceChild(renameBtn, listItem.querySelector('.rename-btn'));

        listItem.removeChild(listItem.querySelector('.delete-btn:last-child'));
    }

    // 模拟文件系统数据，添加 children 属性来表示子文件和文件夹
    let fileSystem = [
        {
            id: '1',
            name: '文档',
            type: 'folder',
            whose: '3390351358@qq.com',
            path: '/文档',
            children: [
                { name: '报告.docx', type: 'file' }
            ]
        },
        {
            name: '图片',
            type: 'folder',
            children: []
        }
    ];
let currentFile;

    // 当前所在的文件夹路径，初始为根目录
    let currentPath = [];

    // 初始化文件列表
    async function initFileList() {
        const fileList = document.getElementById('file-list');
        fileList.innerHTML = '';

        try {
            // 发送请求获取文件列表


            // 根据当前路径获取对应的文件系统数据
            let currentFileSystem = fileSystem;
            for (const pathPart of currentPath) {
                const folder = currentFileSystem.find(item =>
                    item.name === pathPart && item.type === 'folder'
                );
                if (folder) {
                    currentFileSystem = folder.children;
                } else {
                    break;
                }
            }

            // 如果不是根目录，添加返回上一级的按钮
            if (currentPath.length > 0) {
                const backItem = document.createElement('li');
                backItem.className = 'file-item';

                const icon = document.createElement('span');
                icon.className = 'file-icon folder';
                icon.innerHTML = '📁';
                backItem.appendChild(icon);

                const name = document.createElement('span');
                name.className = 'file-name';
                name.textContent = '..';
                backItem.onclick = goBack;
                backItem.appendChild(name);

                fileList.appendChild(backItem);
            }
            // 遍历文件系统数据，创建文件项
            currentFileSystem.forEach((item, index) => {
                //一个文件栏位
                const listItem = document.createElement('li');
                listItem.className = 'file-item';
                //文件栏位主体包括icon&name
                const filebody = document.createElement('div');
                filebody.style = "display:inline-block;width: 80% ; white-space: normal;overflow-wrap: break-word;word-break: break-all;"
                listItem.appendChild(filebody);

                const icon = document.createElement('span');
                icon.className = `file-icon ${item.type}`;
                icon.innerHTML = item.type === 'folder' ? '📁' : '📄';
                filebody.appendChild(icon);


                const name = document.createElement('span');
                name.className = 'file-name';
                name.textContent = item.name;
                if (item.type === 'folder') {
                    filebody.onclick = () => enterFolder(item.name);
                }
                if (item.type === 'file') {
                    filebody.onclick = () => clickFileItem(item.name);
                }
                filebody.appendChild(name);
                //文件操作按钮
                const renameBtn = document.createElement('button');
                renameBtn.className = 'rename-btn';
                renameBtn.textContent = '重命名';
                renameBtn.onclick = () => startRename(item.id);
                listItem.appendChild(renameBtn);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = '删除';
                deleteBtn.onclick = () => isDeletef(item.name,item.type,item.id);
                listItem.appendChild(deleteBtn);

                const moreBtn = document.createElement('button');
                moreBtn.className = 'more-btn';
                moreBtn.textContent = '更多';
                moreBtn.onclick = () => moreOperation(item.name,item.type);
                listItem.appendChild(moreBtn);
                fileList.appendChild(listItem);
            });

            // 更新当前路径显示
            const pathDisplay = document.getElementById('path-display');
            pathDisplay.textContent = `当前路径: /${currentPath.join('/')}`;
        } catch (error) {
            console.error('初始化文件列表出错:', error);
        }
    }

    ////// 进入文件夹
    async function enterFolder(folderName) {
        currentPath.push(folderName);
        await initFileList();
    }

    ////// 返回上一级
    async function goBack() {
        currentPath.pop();
        await initFileList();
    }
    //////获取文件路径系统
    async function getFilePathSystem() {
        // 发送数据到后端
        const sessionId = localStorage.getItem('sessionId');
        let requestUrl = endpointPath + '/folder';
        requestUrl += `;jsessionid=${sessionId}`;
        fileSystem = await fetch(requestUrl, {
            headers: {
                'Cache-Control': 'no-cache, no-store, must-revalidate',
                'Pragma': 'no-cache',
                'Expires': '0'
            }
        }).then(res => res.json());
    }
    //////获取并初始化文件列表
    function getFilePathSystemAndInit() {
        getFilePathSystem()
            .then(data => {
                // 初始化界面
                initFileList();
            })
            .catch(error => {
                console.error('获取文件路径出错:', error);
            });
    }
    window.onload = function () {
        getFilePathSystemAndInit();
    };
    console.log('javascript执行完了');
</script>
